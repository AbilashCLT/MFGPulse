tools:
  - tool_spec:
      type: cortex_analyst_text_to_sql
      name: maintenance_analytics
      description: "Query structured maintenance data: asset health predictions, failure modes, remaining useful life (RUL), degradation stages, fatigue scores, OEE metrics (availability, performance, quality), active alerts (critical/warning/watch), work order history, and asset metadata across 10 industrial assets on 3 production lines."

  - tool_spec:
      type: cortex_search
      name: maintenance_history
      description: "Search maintenance logs and work order notes for root cause investigation. Use when asked WHY an asset is failing, what happened in the past, or to find similar historical failures. Returns technician notes, repair details, and failure descriptions."

  - tool_spec:
      type: generic
      name: diagnose_asset
      description: "Run fast M1-M4 diagnosis on a specific asset. Returns: failure mode prediction (M1), remaining useful life with confidence intervals (M2), degradation stage (M3), and fatigue score (M4). Completes in under 2 seconds. Use as the first step when asked to diagnose or assess an asset."
      input_schema:
        type: object
        properties:
          asset_id:
            type: string
            description: "The asset ID to diagnose (e.g. ASSET_001, ASSET_004). Use ASSET_001 for Compressor A1, ASSET_002 for Compressor A2, ASSET_003 for Pump P1, ASSET_004 for Pump P2, ASSET_005 for Motor M1, ASSET_006 for Motor M2, ASSET_007 for Fan F1, ASSET_008 for Gearbox G1, ASSET_009 for Conveyor C1, ASSET_010 for Turbine T1."
        required:
          - asset_id

  - tool_spec:
      type: generic
      name: deep_analysis
      description: "Run LLM-powered deep analysis (M5-M7) on a specific asset. Returns: root cause analysis with evidence from maintenance history (M5), Monte Carlo failure simulation with probability curves (M6), and prescriptive work order recommendation with cost analysis (M7). Requires M1-M4 outputs as inputs. Use AFTER diagnose_asset when the user wants root cause, simulation, or maintenance prescription."
      input_schema:
        type: object
        properties:
          asset_id:
            type: string
            description: "The asset ID to analyze"
          failure_mode:
            type: string
            description: "Predicted failure mode from M1 (e.g. bearing_wear, thermal_degradation, imbalance, misalignment, normal)"
          rul_hours:
            type: number
            description: "Predicted remaining useful life in hours from M2"
          stage:
            type: string
            description: "Predicted degradation stage from M3 (Healthy, Warning, or Critical)"
          fatigue_score:
            type: number
            description: "Fatigue score from M4 (0 = healthy, 1 = critical)"
        required:
          - asset_id
          - failure_mode
          - rul_hours
          - stage
          - fatigue_score

  - tool_spec:
      type: generic
      name: simulate_scenario
      description: "Run what-if simulation using Monte Carlo method. Shows failure probability at day 3/7/14, RUL distribution (P10/P50/P90), and cost impact under different scenarios. Use when asked what happens if maintenance is delayed, load is reduced, or RPM is adjusted."
      input_schema:
        type: object
        properties:
          current_vib_mag:
            type: number
            description: "Current vibration magnitude in mm/s"
          degradation_velocity:
            type: number
            description: "Rate of degradation per day"
          current_fatigue_score:
            type: number
            description: "Current fatigue score 0-1"
          load_reduction_pct:
            type: number
            description: "Load reduction percentage 0-50"
          maintenance_delay_days:
            type: number
            description: "Days before maintenance 0-14"
          rpm_adjustment_pct:
            type: number
            description: "RPM adjustment percentage -20 to 20"
        required:
          - current_vib_mag
          - degradation_velocity
          - current_fatigue_score
          - load_reduction_pct
          - maintenance_delay_days
          - rpm_adjustment_pct

  - tool_spec:
      type: generic
      name: generate_work_order
      description: "Generate and file a maintenance work order for an asset. Creates the work order in the system, assigns a technician from the shift schedule, auto-reserves parts via BOM lookup, and returns the work order ID. Use when asked to create, generate, or file a work order."
      input_schema:
        type: object
        properties:
          p_asset_id:
            type: string
            description: "Asset ID (e.g. ASSET_001)"
          p_priority:
            type: string
            description: "Priority level: EMERGENCY, HIGH, MEDIUM, or LOW"
          p_action:
            type: string
            description: "Maintenance action description"
          p_parts_needed:
            type: string
            description: "Parts required for the repair"
          p_estimated_cost:
            type: number
            description: "Estimated repair cost in dollars"
        required:
          - p_asset_id
          - p_priority
          - p_action
          - p_parts_needed
          - p_estimated_cost

  - tool_spec:
      type: generic
      name: generate_purchase_order
      description: "Create a purchase order for a specific part needed by an asset. Resolves the preferred supplier, calculates expected arrival from lead time, checks for duplicate open POs, and classifies procurement risk (CRITICAL_SHORTAGE / EXPEDITE / ORDER_NOW). Use when diagnosis reveals parts are needed and stock is low, or when the user asks to order parts, create a PO, or procure a replacement."
      input_schema:
        type: object
        properties:
          p_asset_id:
            type: string
            description: "Asset ID that needs the part (e.g. ASSET_001)"
          p_part_id:
            type: string
            description: "Part ID to order (e.g. PART-001). Use maintenance_analytics to look up which parts are compatible with the asset or check PROCUREMENT_RECOMMENDATIONS."
          p_quantity:
            type: number
            description: "Quantity to order (default 1)"
          p_required_by_date:
            type: string
            description: "Date the part is needed by in YYYY-MM-DD format. Derive from RUL if available."
          p_wo_id:
            type: string
            description: "Work order ID this PO supports (if a WO was just created, pass its ID here)"
          p_priority:
            type: string
            description: "EMERGENCY, EXPEDITE, HIGH, or NORMAL. Use EMERGENCY if RUL < 24h, EXPEDITE if RUL < 72h, HIGH if Critical stage, NORMAL otherwise."
        required:
          - p_asset_id
          - p_part_id
          - p_quantity
          - p_required_by_date
          - p_wo_id
          - p_priority

