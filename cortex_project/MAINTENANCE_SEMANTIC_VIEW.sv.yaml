      - name: USERNAME
        description: "Display name of the user (e.g. Mike Torres, Sarah Chen)."
        expr: USERNAME
        data_type: VARCHAR(100)
        access_modifier: public_access
      - name: USER_ID
        description: Unique user identifier (USR-001 through USR-008).
        expr: USER_ID
        data_type: VARCHAR(20)
        access_modifier: public_access
    time_dimensions:
      - name: CREATED_AT
        expr: CREATED_AT
        data_type: TIMESTAMP_NTZ(9)
        access_modifier: public_access
  - name: WORK_ORDERS
    base_table:
      database: MFGPULSE_DB
      schema: RAW_IT
      table: WORK_ORDERS
    primary_key:
      columns:
        - WO_ID
    dimensions:
      - name: ASSET_ID
        expr: ASSET_ID
        data_type: VARCHAR(20)
        access_modifier: public_access
      - name: ASSIGNED_TO
        description: Technician assigned to the work order.
        expr: ASSIGNED_TO
        data_type: VARCHAR(100)
        access_modifier: public_access
      - name: PRIORITY
        description: "Priority level (CRITICAL, HIGH, MEDIUM, LOW)."
        expr: PRIORITY
        data_type: VARCHAR(10)
        access_modifier: public_access
      - name: STATUS
        description: "Current status (open, in_progress, completed)."
        expr: STATUS
        data_type: VARCHAR(20)
        access_modifier: public_access
      - name: WO_ID
        expr: WO_ID
        data_type: VARCHAR(50)
        access_modifier: public_access
      - name: WO_TYPE
        description: "Work order type (emergency, corrective, preventive)."
        expr: WO_TYPE
        data_type: VARCHAR(20)
        access_modifier: public_access
    facts:
      - name: LABOR_HOURS
        expr: LABOR_HOURS
        data_type: FLOAT
        access_modifier: public_access
      - name: PARTS_COST
        expr: PARTS_COST
        data_type: FLOAT
        access_modifier: public_access
      - name: TOTAL_COST
        expr: TOTAL_COST
        data_type: FLOAT
        access_modifier: public_access
    time_dimensions:
      - name: COMPLETED_DATE
        expr: COMPLETED_DATE
        data_type: TIMESTAMP_NTZ(9)
        access_modifier: public_access
      - name: CREATED_DATE
        expr: CREATED_DATE
        data_type: TIMESTAMP_NTZ(9)
        access_modifier: public_access
